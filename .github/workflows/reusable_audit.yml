name: Shared A11y Audit

on:
  workflow_call:
    inputs:
      provider:
        description: 'AI provider (groq or gemini)'
        required: false
        default: 'groq'
        type: string
      model:
        description: 'Model to use'
        required: false
        default: 'qwen/qwen3.8-27b'
        type: string
      use_compact_skill:
        description: 'Use compact skill template (true); multi skill approach (false)'
        required: false
        default: true
        type: boolean
    secrets:
      GROQ_API_KEY:
        required: false
      GEMINI_API_KEY:
        required: false

jobs:
  run-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout Client Repository (App Code)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Checkout A11y Guardian Engine (Python Core)
        uses: actions/checkout@v5
        with:
          repository: CesarMontesDeOcaT/mobile-a11y-guardian
          path: .guardian_engine

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r .guardian_engine/requirements.txt

      - name: Identify Modified UI Files
        id: filter_files
        run: |
          # Detecta automáticamente si el PR va hacia main, master o dev
          BASE_BRANCH="${{ github.base_ref }}"
          # Get the modified .kt or .swift files compared to the base branch of the PR
          MODIFIED_FILES=$(git diff --name-only --diff-filter=d "origin/$BASE_BRANCH"...HEAD | grep -E '\.(kt|swift)$' || true)

          if [ -z "$MODIFIED_FILES" ]; then
            echo "has_files=false" >> $GITHUB_OUTPUT
            echo "No modified UI files found."
          else
            echo "has_files=true" >> $GITHUB_OUTPUT
            # Save the list to a temporary file for safe iteration
            echo "$MODIFIED_FILES" > modified_ui_files.txt
            echo "Files detected for audit:"
            cat modified_ui_files.txt
          fi

      - name: Run A11y Audit Engine
        if: steps.filter_files.outputs.has_files == 'true'
        env:
          A11Y_PROVIDER: 'groq' # Change 'gemini' when you want to switch
          GROQ_MODEL: 'qwen/qwen3.8-27b'
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          A11Y_USE_COMPACT_SKILL: ${{ inputs.use_compact_skill && 'true' || 'false' }}
          PYTHONPATH: .guardian_engine
        run: |
          # Initialize the empty comments array
          echo "[]" > all_comments.json

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            echo "--- Analyzing: $file ---"

            # Run the CLI indicating to output to a temporary file
            python -m a11y_guardian.cli "$file" --json-output "temp_comments.json" || true

            # Concatenate the comments if the temporary file exists
            if [ -f "temp_comments.json" ]; then
              jq -s '.[0] + .[1]' all_comments.json temp_comments.json > combined.json && mv combined.json all_comments.json
            fi
          done < modified_ui_files.txt

      - name: Post Inline Review Comments on PR
        if: steps.filter_files.outputs.has_files == 'true'
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            if (!fs.existsSync('all_comments.json')) {
              console.log("No comments file generated.");
              return;
            }

            const comments = JSON.parse(fs.readFileSync('all_comments.json', 'utf8'));

            if (!comments || comments.length === 0) {
              console.log("No accessibility gaps detected. All good!");
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request.number;
            const commit_id = context.payload.pull_request.head.sha;

            // 1. Get all existing inline review comments in the PR
            const existingReviewComments = await github.paginate(
              github.rest.pulls.listReviewComments,
              { owner, repo, pull_number }
            );

            // 2. Get all existing general comments in the PR (fallback)
            const existingIssueComments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number: pull_number }
            );

            for (const comment of comments) {
              // Check if an inline comment already exists on the same path and line with the A11y header
              const isInlineDuplicate = existingReviewComments.some(c => 
                c.path === comment.path && 
                c.line === comment.line && 
                c.body.includes("A11y: Reading Fragmentation")
              );

              // Check if it already exists as a general comment
              const isGeneralDuplicate = existingIssueComments.some(c => 
                c.body.includes(`\`${comment.path}\` (Line ${comment.line})`)
              );

              if (isInlineDuplicate || isGeneralDuplicate) {
                console.log(`[SKIP] Comment already exists for ${comment.path}:${comment.line}. Skipping duplicate.`);
                continue;
              }

              try {
                // Attempt 1: Inline Review Comment directly on the line in the Diff
                await github.rest.pulls.createReviewComment({
                  owner: owner,
                  repo: repo,
                  pull_number: pull_number,
                  commit_id: commit_id,
                  path: comment.path,
                  line: comment.line,
                  body: comment.body
                });
                console.log(`Inline comment posted on ${comment.path}:${comment.line}`);
              } catch (error) {
                console.warn(`Line ${comment.line} out of diff for ${comment.path}. Posting as a general comment on the PR.`);

                await github.rest.issues.createComment({
                  owner: owner,
                  repo: repo,
                  issue_number: pull_number,
                  body: `📍 **Finding in \`${comment.path}\` (Line ${comment.line})**\n\n${comment.body}`
                });
              }
            }
